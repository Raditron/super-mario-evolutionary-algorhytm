# The settings for the next training run: py -m mario train [config]
# Game constants never go here; they live in mario/constants/.

[run]
name = "first-run"          # used in the run folder's name
seed = 1                    # the one random seed of the run
generations = 500
population_size = 1000

# The learning algorithm's own settings, with keys it chooses. The game hands
# this table, unread, to neuroevolution.create_algorithm as a plain dict.
[algorithm]
hidden_layer_size = 24
button_press_threshold = 0.0
coin_reward = 100
flag_reward = 20000
time_reward = 1.0416666666666667   # 100 / 96
tournament_size = 3
mutation_rate = 0.05
mutation_strength = 0.05
crossover_rate = 0.7
elite_count = 10
