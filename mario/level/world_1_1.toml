# World 1-1, decoded from the game's level data (docs/research/world-1-1-layout.md, #3).
#
# layer_1: the solid and interactive tiles, 224 columns x 15 rows of 16 px,
# row 0 at the top. Legend (mario/level/tile_kind.py):
#   .  empty            X  ground           #  hard block (staircases, flagpole base)
#   B  brick            ?  ? block, coin    M  ? block, power-up
#   S  brick, Starman   C  brick, multi-coin
#   U  hidden 1-UP block (invisible)        W  invisible castle stopper
#   [ ]  pipe top, left / right half        { }  pipe body, left / right half
#   o  flagpole ball    |  flagpole shaft
#
# layer_2: the background scenery, drawn behind layer 1 by the Sprite view only
# and never solid; same size. Legend (mario/level/background_scenery.py):
#   .  nothing          c  cloud            h  hill             b  bush
#   ^  castle battlement                    w  castle window    =  castle brick
#   (  castle door arch                     D  castle door
#
# pipes: left column, top row, height in tiles above the ground (cap included),
# and what the pipe leads to.
# enemies: in spawn order, with the column from the enemy data and the row the
# enemy rests on. A goomba_pair is placed relative to its data column (#8).
#
# bonus_room: the underground coin room the warp pipe leads to (#23), one screen
# of 16 columns x 15 rows, its layer_1 in the same legend, plus:
#   $  coin             <  sideways exit pipe, mouth            -  sideways exit pipe, body
# The exit pipe's mouth is given by its lower tile, which Mario walks into; it
# brings him back to the level at return_page (16 columns a page).

